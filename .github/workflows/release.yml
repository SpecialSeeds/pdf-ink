name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            # All three are required release artifacts for this plugin, so a missing
            # one is a build failure rather than something to work around.
            - name: Verify release artifacts
              run: |
                  for file in main.js manifest.json styles.css; do
                    [ -f "$file" ] || { echo "missing $file"; exit 1; }
                  done

            # The tag has to match manifest.json's version, or Obsidian will offer
            # users a release whose manifest disagrees with it.
            - name: Check tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "tag $tag does not match manifest version $version"
                    exit 1
                  fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            # Published straight away, titled with the tag. Notes come from
            # release-notes/<tag>.md when that file is in the tagged commit, and
            # are generated from the commits since the previous release otherwise.
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  notes_file="release-notes/${tag}.md"

                  if [ -f "$notes_file" ]; then
                    notes=(--notes-file "$notes_file")
                  else
                    notes=(--generate-notes)
                  fi

                  gh release create "$tag" \
                    --title "$tag" \
                    "${notes[@]}" \
                    main.js manifest.json styles.css
